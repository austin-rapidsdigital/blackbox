name: Release
# Publishes the Windows and Linux packages on the Releases page.
# Either run it from the Actions tab ("Run workflow", enter a version such
# as 0.2.0), or push a tag: git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF_NAME}"
          fi
          v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - name: Test
        run: go test ./...
      - name: Build packages
        run: VERSION="${{ steps.v.outputs.version }}" scripts/build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cat > notes.md <<NOTES
          ## Download

          | System | File | Install |
          |---|---|---|
          | Windows 11 / Server 2025 | \`Blackbox-Setup-${VERSION}.exe\` | Double-click it and answer the questions (it also upgrades an installed Blackbox) |
          | Linux (x86-64) | \`blackbox-${VERSION}-linux-amd64.tar.gz\` | Extract, then \`sudo ./install.sh\` |
          | Linux (ARM64) | \`blackbox-${VERSION}-linux-arm64.tar.gz\` | Extract, then \`sudo ./install.sh\` |

          Check downloads with \`sha256sum -c SHA256SUMS\`. See the [README](https://github.com/casea1/blackbox#readme) and the [Windows](https://github.com/casea1/blackbox/blob/main/docs/windows.md) and [Linux](https://github.com/casea1/blackbox/blob/main/docs/linux.md) guides.
          NOTES
          gh release create "$TAG" dist/*.exe dist/*.tar.gz dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Blackbox $TAG" --notes-file notes.md
