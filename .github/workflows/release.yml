name: Release
# Tag a version (git tag v0.2.0 && git push origin v0.2.0) to build the
# Windows and Linux packages and publish them on the Releases page.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build packages
        run: VERSION="${GITHUB_REF_NAME}" scripts/build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz dist/SHA256SUMS \
            --title "Blackbox ${GITHUB_REF_NAME}" \
            --notes "**Windows:** download \`blackbox-${GITHUB_REF_NAME#v}-windows-amd64.zip\`, unzip it, and double-click \`Install.cmd\`.
          **Linux:** download the \`linux-amd64\` (or \`arm64\`) \`.tar.gz\`, extract it, and run \`sudo ./install.sh\`.
          Verify downloads with \`sha256sum -c SHA256SUMS\`. See the [README](https://github.com/casea1/blackbox#readme) for details."
